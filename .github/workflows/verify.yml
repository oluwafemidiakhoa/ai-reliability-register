# Verify every entry's seal and validate every entry against the schema. Nothing else.
# Built to keep passing unattended: no dependencies beyond the runner's python3, and the one
# action is pinned to a commit (actions/checkout v4.2.2), not a moving tag.
name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/verify.py
